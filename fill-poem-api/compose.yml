volumes:
  pgdata:

services:
  adminer:
    image: adminer:6-standalone
    ports: ["19299:8080"]
    environment:
      - ADMINER_DEFAULT_SERVER=db
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: fillpoem
    command:
      - postgres
      - -c
      - shared_buffers=64MB
    ports:
      - "11004:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - pgdata:/var/lib/postgresql
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fillpoem"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local convenience: run a release image against the compose deps.
  # Override the tag with APP_IMAGE in .env.
  api:
    image: ${APP_IMAGE:-fill-poem-api:0.1.0}
    env_file: .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "17073"
      DATABASE_URL: postgres://postgres:secret@db:5432/fillpoem?sslmode=disable
    ports:
      - "17073:17073"
    depends_on:
      db:
        condition: service_healthy
